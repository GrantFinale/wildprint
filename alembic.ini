# Alembic configuration for wildprint.
#
# The actual SQLAlchemy URL is read from the DATABASE_URL env var inside
# alembic/env.py. We leave `sqlalchemy.url` empty here so that no secret
# leaks into the repo and so that env switching is purely env-var driven.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Filename template for new revisions: zero-padded numeric prefix + slug.
# Sticking to numeric (vs. timestamps) keeps history readable in `git log`.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# No post-write hooks. Add ruff/black here once 0.8 (CI) lands.

# ---------------------------------------------------------------------------
# Logging — quiet by default, set ALEMBIC_LOG_LEVEL=DEBUG to debug autogen.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
