<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin · Sign in · FishingPoster.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/foundation.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--wp-bone);
            color: var(--wp-charcoal);
            padding: var(--wp-space-6);
        }
        .login-card {
            background: var(--wp-white);
            padding: var(--wp-space-8) var(--wp-space-8);
            border: 1px solid var(--wp-rule);
            border-radius: var(--wp-radius);
            width: 100%;
            max-width: 380px;
        }
        .login-card .brand {
            font-size: var(--wp-text-lg);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--wp-charcoal);
            display: block;
            margin-bottom: var(--wp-space-1);
        }
        .login-card .brand .dot { color: var(--wp-hunter); }
        .login-card .eyebrow {
            font-size: var(--wp-text-xs);
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--wp-hunter);
            margin-bottom: var(--wp-space-5);
            display: block;
        }
        .login-card h1 {
            margin: 0 0 var(--wp-space-5);
            font-size: var(--wp-text-xl);
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .login-card label {
            display: block;
            margin-bottom: var(--wp-space-1);
            font-size: var(--wp-text-sm);
            font-weight: 500;
            color: var(--wp-charcoal);
        }
        .login-card input[type="email"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 10px var(--wp-space-3);
            margin-bottom: var(--wp-space-4);
            border: 1px solid var(--wp-rule-strong);
            border-radius: var(--wp-radius);
            font: inherit;
            font-size: var(--wp-text-sm);
            color: var(--wp-charcoal);
            background: var(--wp-white);
            box-sizing: border-box;
            min-height: 40px;
        }
        .login-card input:focus {
            outline: none;
            border-color: var(--wp-charcoal);
            box-shadow: 0 0 0 1px var(--wp-charcoal);
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            background: var(--wp-hunter);
            color: var(--wp-white);
            border: 1px solid var(--wp-hunter);
            border-radius: var(--wp-radius);
            font: inherit;
            font-size: var(--wp-text-base);
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
        }
        .login-card button:hover { background: var(--wp-hunter-deep); }
        .login-card .error {
            color: var(--wp-status-err);
            background: rgba(179, 58, 58, 0.05);
            border: 1px solid var(--wp-status-err);
            border-left-width: 3px;
            padding: var(--wp-space-3) var(--wp-space-4);
            border-radius: var(--wp-radius);
            margin-bottom: var(--wp-space-4);
            font-size: var(--wp-text-sm);
        }
    </style>
</head>
<body>
    <form class="login-card" method="POST" action="{{ url_for('auth.login') }}" aria-label="Admin sign-in">
        <span class="brand">FishingPoster<span class="dot">.</span>com</span>
        <span class="eyebrow">Admin</span>
        <h1>Sign in</h1>
        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="username" inputmode="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit">Sign in</button>
    </form>
</body>
</html>
