{% extends "account/_base.html" %}
{% block title %}Profile · FishingPoster.com{% endblock %}
{% block content %}
<header class="page-head">
  <span class="wp-eyebrow">Account</span>
  <h1>Profile</h1>
  <p class="page-head__subtitle">Update how we reach you and your marketing preferences.</p>
</header>

<section class="card" style="max-width: 480px;">
  <form method="post" action="{{ url_for('account.profile') }}">
    <label for="profile-name">Name
      <input id="profile-name" type="text" name="name" value="{{ customer.name or '' }}" autocomplete="name">
    </label>
    <label for="profile-email">Email
      <input id="profile-email" type="email" name="email" value="{{ customer.email }}" required autocomplete="email" inputmode="email">
      <small class="muted">Changing your email re-verifies via a magic link.</small>
    </label>
    <label class="wp-checkbox-row" style="margin: var(--wp-space-4) 0;">
      <input type="checkbox" name="marketing_opt_in" value="1" {% if customer.marketing_opt_in %}checked{% endif %}>
      Email me occasional updates
    </label>
    <button type="submit" class="wp-btn wp-btn--primary">Save changes</button>
  </form>
</section>
{% endblock %}
